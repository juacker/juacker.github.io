<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLAI — Desktop multi-agent orchestration</title>
<meta name="description" content="CLAI is a desktop app for building, running, and supervising small teams of AI agents, with MCP-native tools and a local execution sandbox.">
<meta property="og:title" content="CLAI">
<meta property="og:description" content="A desktop app for building, running, and supervising small teams of AI agents.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://juacker.github.io/clai/">
<meta property="og:image" content="https://juacker.github.io/clai/auth/logo.png">
<link rel="icon" type="image/png" href="auth/logo.png">
<style>
  :root{
    --bg:#0b0d17; --panel:#151a2e; --panel-brd:#242c47;
    --ink:#e8ebf5; --muted:#9aa3c0; --faint:#6b7494;
    --indigo:#818cf8; --indigo2:#6366f1; --green:#00c49a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{color:var(--indigo); text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:940px; margin:0 auto; padding:0 24px; width:100%}

  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:48px 0 32px}

  /* hero */
  .hero{position:relative; overflow:hidden; text-align:center; margin-bottom:34px}
  .hero::before{
    content:""; position:absolute; inset:-60% -20% auto -20%; height:520px; z-index:0;
    background:
      radial-gradient(closest-side at 30% 30%, rgba(99,102,241,.32), transparent 70%),
      radial-gradient(closest-side at 75% 35%, rgba(0,196,154,.22), transparent 70%);
    filter:blur(8px);
  }
  .hero > *{position:relative; z-index:1}
  .logo{width:88px; height:88px; margin:0 auto 18px; display:block; filter:drop-shadow(0 8px 28px rgba(99,102,241,.35))}
  h1{font-size:clamp(38px,7vw,64px); margin:0; letter-spacing:-.03em; font-weight:800;
     background:linear-gradient(120deg,#fff 20%,var(--indigo) 70%,var(--green) 120%);
     -webkit-background-clip:text; background-clip:text; color:transparent}
  .tagline{font-size:clamp(18px,2.4vw,23px); color:var(--ink); margin:16px auto 6px; max-width:680px; font-weight:500}
  .sub{color:var(--muted); max-width:600px; margin:0 auto 24px}
  .badges{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:26px}
  .pill{font-size:12.5px; color:var(--muted); border:1px solid var(--panel-brd); background:var(--panel);
        padding:5px 12px; border-radius:999px}
  .cta{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
  .btn{display:inline-flex; align-items:center; gap:9px; padding:13px 24px; border-radius:12px; font-weight:600;
       font-size:15px; border:1px solid transparent; transition:transform .12s ease, box-shadow .12s ease}
  .btn:hover{text-decoration:none; transform:translateY(-2px)}
  .btn-primary{background:linear-gradient(120deg,var(--indigo2),var(--indigo)); color:#fff;
               box-shadow:0 10px 30px rgba(99,102,241,.4)}
  .btn-ghost{background:var(--panel); color:var(--ink); border-color:var(--panel-brd)}
  .btn svg{width:18px; height:18px}

  /* showcase */
  .showcase video{width:100%; display:block; border-radius:14px; border:1px solid var(--panel-brd);
                  box-shadow:0 34px 90px -24px rgba(0,0,0,.65); background:var(--panel)}

  footer{border-top:1px solid var(--panel-brd); padding:22px 0 30px; color:var(--faint); font-size:13.5px;
         display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center}
  footer a{color:var(--muted)}
</style>
</head>
<body>

<main class="wrap">
  <header class="hero">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="CLAI logo">
      <defs>
        <linearGradient id="indigo" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#6366F1"/>
        </linearGradient>
        <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00C49A"/><stop offset="100%" stop-color="#00AB94"/>
        </linearGradient>
      </defs>
      <path d="M380 95 C200 70 70 140 70 256 C70 372 200 442 380 417" fill="none" stroke="url(#indigo)" stroke-width="52" stroke-linecap="round"/>
      <circle cx="256" cy="256" r="70" fill="url(#green)"/>
      <circle cx="235" cy="235" r="12" fill="#fff" opacity="0.9"/>
    </svg>
    <h1>CLAI</h1>
    <p class="tagline">Build, run, and supervise small teams of AI agents — on your desktop.</p>
    <p class="sub">Multi-agent orchestration, with MCP-native tools and a local execution sandbox.</p>
    <div class="badges">
      <span class="pill">macOS · Windows · Linux</span>
      <span class="pill">MCP-native</span>
      <span class="pill">MIT licensed</span>
    </div>
    <div class="cta">
      <a class="btn btn-primary" href="https://github.com/juacker/clai/releases">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </a>
      <a class="btn btn-ghost" href="https://github.com/juacker/clai">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-1.7c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.8 18.3 5.1 18.3 5.1c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
        View on GitHub
      </a>
    </div>
  </header>

  <div class="showcase">
    <video src="clai-demo.mp4" poster="screenshot.png" autoplay loop muted playsinline controls
         aria-label="CLAI desktop app demo — creating a workspace, adding a helper agent, and delegating work"></video>
  </div>
</main>

<footer class="wrap">
  <span>CLAI · MIT licensed</span>
  <span><a href="https://github.com/juacker/clai">GitHub</a> · <a href="https://github.com/juacker/clai/releases">Releases</a> · <a href="auth/client-metadata.json">CIMD</a></span>
</footer>

</body>
</html>
